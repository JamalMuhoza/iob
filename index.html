/* Design: University of Arkansas at Monticello web identity.
   Forest-green nav, kelly-green bands, heavy slab headlines, condensed uppercase nav and labels (UAM brand vernacular),
   cream sections, white cards, events-style date chips used for section numbers (7.1, 7.2...).
   avoid-ai-design-ignore: SD4 (uppercase condensed labels are the UAM site's own type system) */
:root{
 --forest:#00664a;--forest2:#00513b;--kelly:#00ae6e;--kelly2:#009a61;--cream:#f4f2ec;--sheet:#ffffff;
 --rule:#d6dbd8;--rule2:#b9c3bd;--ink:#1d2622;--muted:#55625b;
 --acc:#00664a;--acc-ink:#ffffff;--acc-soft:#e6f4ee;--band-ink:#0f2a20;
 --hi:#fdf0a3;--hi-ink:#1d2622;--okc:#00875a;--revc:#b06a00;--badc:#b3261e;
 --slab:"Alfa Slab One","Rockwell Extra Bold","Rockwell",Georgia,serif;
 --cond:"Oswald","Arial Narrow","Roboto Condensed",Arial,sans-serif;
 --sans:"Open Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
 --r:3px;
 --bg:var(--cream);--bg2:var(--sheet);--panel:var(--sheet);--line:var(--rule);--dim:var(--muted);--ok:var(--okc);--bad:var(--badc)
}
html.dark{
 --cream:#111c17;--sheet:#18261f;--rule:#2c3d34;--rule2:#3d5046;--ink:#e8eeea;--muted:#a9b8b0;
 --acc:#3fcf92;--acc-ink:#062317;--acc-soft:#1d3329;--band-ink:#062317;
 --hi:#56501d;--hi-ink:#f6f1d6;--okc:#4cc38c;--revc:#e5a64a;--badc:#f08a80
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
sub,sup{line-height:0}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--kelly);outline-offset:2px}
h1,h2{margin:0;line-height:1.15;font-family:var(--slab);font-weight:400;color:var(--forest)}
html.dark h1,html.dark h2{color:var(--ink)}
h3{margin:0;line-height:1.25;font-family:var(--cond);font-weight:600;font-size:18px;color:var(--forest)}
html.dark h3{color:var(--acc)}
h1{font-size:clamp(28px,3.4vw,40px)}
h2{font-size:clamp(21px,2.3vw,27px)}
/* top nav: UAM forest bar */
.top{position:sticky;top:0;z-index:20;display:flex;gap:16px;align-items:center;padding:0 22px;min-height:58px;background:var(--forest);color:#fff}
html.dark .top{background:#0a3a2b}
.logo{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;color:#fff;text-align:left;white-space:nowrap}
.logo:before{content:"UAM";font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.04em;background:var(--kelly);color:#fff;padding:6px 7px;border-radius:2px}
.logo{font-family:var(--cond);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.logo small{display:block;font-family:var(--sans);text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:#bfe3d3}
.search{flex:1;min-width:120px;max-width:400px;position:relative}
.search input{width:100%;background:#fff;border:0;color:#1d2622;border-radius:var(--r);padding:8px 12px 8px 34px;font:inherit;font-size:14px}
html.dark .search input{background:#123326;color:var(--ink)}
.search input::placeholder{color:#6b776f}
.search:before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;margin-top:-8px;border:2px solid #6b776f;border-radius:50%}
.search:after{content:"";position:absolute;left:24px;top:50%;width:6px;height:2px;margin-top:5px;background:#6b776f;transform:rotate(45deg)}
.modes{display:flex;gap:0;margin-left:auto;align-self:stretch}
.mbtn{background:none;border:0;border-bottom:4px solid transparent;border-radius:0;padding:0 14px;font-family:var(--cond);font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:#d9efe5}
.mbtn:hover{color:#fff;background:var(--forest2)}
.mbtn.on{color:#fff;border-bottom-color:var(--kelly)}
.burger{display:none}
/* layout: UAM sidebar nav beside the page */
.shell{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--rule);padding:18px 14px 40px;position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow:auto;background:var(--sheet)}
.sec{margin-bottom:14px}
.sechd{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:2px solid var(--kelly);padding:6px 4px 6px;border-radius:0}
.sechd:hover b{color:var(--kelly2)}
.sechd>span:last-child>span{font-family:var(--cond);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sechd b{display:block;font-family:var(--cond);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--forest)}
html.dark .sechd b{color:var(--acc)}
.dot{display:none}
.tlist{margin:6px 0 0}
.tl{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 4px;font-size:13.5px;line-height:1.35;color:var(--ink);border-radius:0}
.tl:hover{background:var(--acc-soft)}
.tl.on{background:var(--acc-soft);font-weight:700;box-shadow:inset 0 0 0 0 transparent}
.tl .no{flex:none;width:32px;font-family:var(--cond);font-weight:600;font-size:14px;color:var(--kelly2)}
html.dark .tl .no{color:var(--acc)}
.tl.done .no:after{content:" \2713";color:var(--okc)}
main{--g:clamp(16px,3.4vw,46px);padding:28px var(--g) 70px;min-width:0}
/* surfaces */
.card{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.hud{font-family:var(--cond);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
/* home: kelly band with two-line slab headline, then forest stats bar */
main>.hero{margin:-28px calc(-1*var(--g)) 0;border:0;border-radius:0;padding:34px var(--g) 30px;background:var(--kelly);color:var(--band-ink);border-top:10px solid var(--forest2)}
.hero .hud{color:var(--band-ink);font-weight:600}
.hero h1{color:var(--band-ink);font-size:clamp(28px,3.6vw,44px)}
.hero h1 .l2{display:block;color:#fff}
.hero p{color:var(--band-ink);max-width:70ch;margin:12px 0 0;font-size:16px}
.stats{display:flex;flex-wrap:wrap;margin:22px 0 0;padding:16px 18px;background:var(--forest);color:#fff}
.stat{padding:2px 26px;border-left:1px solid rgba(255,255,255,.3);text-align:center}
.stat:first-child{border-left:0;padding-left:0}
.stat b{font-family:var(--slab);font-weight:400;font-size:28px;color:#fff;display:block}
.stat span{font-family:var(--cond);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#c6eadb}
.card .stats{margin:14px 0 0;padding:14px 16px;border-radius:var(--r)}
.trkst b.rev{color:#ffd28a}.trkst b.new{color:#d5e6dd}
.sectitle{text-align:center;margin-top:34px;margin-bottom:18px}
.scard{cursor:pointer;text-align:left;padding:0;display:block;width:100%;overflow:hidden;transition:border-color .15s}
.scard:hover{border-color:var(--kelly)}
.scard .hud{display:block;background:var(--forest);color:#fff;padding:8px 18px}
.scard h2{font-family:var(--cond);font-weight:600;font-size:22px;color:var(--forest);margin:14px 18px 0!important}
html.dark .scard h2{color:var(--acc)}
.scard p{color:var(--muted);font-size:14.5px;margin:8px 18px 0}
.meter{height:5px;background:var(--rule);margin:16px 18px 0;overflow:hidden}
.meter i{display:block;height:100%;background:var(--kelly)}
.meta{font-family:var(--cond);font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 18px 16px}
.how{list-style:none;counter-reset:s;margin-top:30px;margin-bottom:0;padding:22px 0 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 30px}
.how li{counter-increment:s;position:relative;padding-left:44px;font-size:14.5px;color:var(--muted)}
.how li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;display:grid;place-items:center;background:var(--forest);color:#fff;font-family:var(--slab);font-size:17px;border-radius:2px}
.how li b{display:block;font-family:var(--cond);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.03em;color:var(--forest)}
html.dark .how li b{color:var(--acc)}
.foot{margin:46px calc(-1*var(--g)) -70px;padding:22px var(--g);background:var(--forest);color:#d4ece1;font-size:13.5px;border-top:6px solid var(--kelly)}
/* section number chip, modeled on the UAM events date chip */
.badge,.secno{flex:none;display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;border:1px solid var(--forest);border-radius:2px;overflow:hidden;background:var(--sheet);min-width:46px}
.badge span,.secno span{display:block;background:var(--forest);color:#fff;font-family:var(--cond);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:1px 6px}
.badge b,.secno b{display:block;font-family:var(--slab);font-weight:400;font-size:17px;color:var(--forest);padding:2px 6px 3px;line-height:1.3}
.secno{min-width:58px}.secno b{font-size:22px}
html.dark .badge,html.dark .secno{border-color:var(--acc)}
html.dark .badge span,html.dark .secno span{background:var(--acc);color:var(--acc-ink)}
html.dark .badge b,html.dark .secno b{color:var(--ink)}
/* chapter page topic cards */
.tcard{cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%;transition:border-color .15s}
.tcard:hover{border-color:var(--kelly)}
.tcard .top2{display:flex;gap:12px;align-items:center}
.tcard .nm{font-family:var(--cond);font-weight:600;font-size:17px;color:var(--forest);line-height:1.25}
html.dark .tcard .nm{color:var(--acc)}
.tcard .gist{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .chips{display:none}
.tcard.done{border-color:var(--okc)}
.tick{margin-left:auto;font-family:var(--cond);font-size:13px;text-transform:uppercase;color:var(--okc);white-space:nowrap}
.chip{display:inline-block;font-size:13.5px;color:var(--muted);border:1px solid var(--rule);border-radius:var(--r);padding:4px 10px}
/* topic page: kelly breadcrumb band */
main>div>.tophd,main>.tophd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:-28px calc(-1*var(--g)) 22px;padding:10px var(--g);background:var(--kelly)}

.tophd .hud{color:var(--band-ink);font-weight:600}
.tophd .btn{background:#fff;border-color:#fff;color:var(--forest)}
.tophd .btn:hover{background:var(--forest);border-color:var(--forest);color:#fff}
html.dark .tophd .btn{background:var(--sheet);border-color:var(--sheet);color:var(--ink)}
.ttl{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule2)}
.btn{background:var(--sheet);border:1px solid var(--forest);border-radius:var(--r);padding:7px 14px;font-family:var(--cond);font-size:14.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--forest);transition:background .15s,color .15s}
html.dark .btn{border-color:var(--acc);color:var(--acc)}
.btn:hover{background:var(--forest);color:#fff}
html.dark .btn:hover{background:var(--acc);color:var(--acc-ink)}
.btn.pri{background:var(--forest);color:#fff;border-color:var(--forest)}
.btn.pri:hover{background:var(--kelly2);border-color:var(--kelly2)}
html.dark .btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.done{background:var(--okc);border-color:var(--okc);color:#fff}
html.dark .btn.done{color:var(--acc-ink)}
.gistbox{padding:14px 18px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);font-size:16.5px;margin:18px 0}
.gistbox .hud{color:var(--kelly2);font-weight:600}
html.dark .gistbox .hud{color:var(--acc)}
/* tabs: UAM sub-nav row */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 18px;padding:0;border-top:6px solid var(--forest);background:var(--sheet);border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;margin-bottom:-1px;font-family:var(--cond);font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--forest)}
html.dark .tab{color:var(--muted)}
.tab:hover{color:var(--kelly2)}
.tab.on{border-bottom-color:var(--kelly);color:var(--ink);font-weight:600}
.pt{padding:14px 16px}
.pt h3{margin-bottom:4px}
.pt p{margin:0;font-size:15px}
.remember{margin-top:18px;padding:14px 16px;background:var(--hi);color:var(--hi-ink);border-radius:var(--r)}
.remember .hud{color:inherit;font-weight:600}
.remember b{color:inherit}
.termgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.term{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;transition:border-color .15s}
.term:hover{border-color:var(--kelly)}
.term b{display:block;font-family:var(--cond);font-weight:600;font-size:16px;color:var(--forest)}
html.dark .term b{color:var(--acc)}
.term span{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.term.closed span{display:none}
.term.closed:after{content:"Tap to reveal";font-size:12.5px;color:var(--muted)}
.eq{padding:14px 16px;margin-top:10px}
.eq .e{font-size:19px;font-family:Georgia,serif;color:var(--ink);padding:8px 12px;background:var(--acc-soft);border-radius:var(--r);overflow-x:auto}
.eq p{margin:8px 0 0;font-size:14.5px;color:var(--muted)}
/* figures always sit on a white plate */
.fig{padding:16px}
.fig svg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:6px;--ink:#10281a;--dim:#4d6856;--bg2:#ffffff;--c1:#0b7a3e;--c2:#0b6e64;--c3:#4d7c0f}
.t8 .fig svg{--c1:#a3560a;--c2:#b42a4b;--c3:#0b7a3e}
.t9 .fig svg{--c1:#0b6e61;--c2:#5536b8;--c3:#8a6408}
.fig p{margin:10px 0 0;color:var(--muted);font-size:14.5px}
.vs ul,.steps ul{margin:0;padding-left:18px}
.vs li{margin:5px 0;font-size:15px}
.ex{padding:18px}
.ans{margin-top:12px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--okc);background:var(--sheet)}
.ans .hud{color:var(--okc);font-weight:600}
.hide{display:none}
/* quiz */
.q{padding:18px;margin-bottom:14px}
.q .qt{font-size:17px;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 13px;border-radius:var(--r);border:1px solid var(--rule2);background:var(--sheet);transition:border-color .12s;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--kelly)}
.opt .l{font-family:var(--cond);font-weight:600;color:var(--forest);margin-right:10px}
html.dark .opt .l{color:var(--acc)}
.opt.right{border-color:var(--okc);background:color-mix(in srgb,var(--okc) 13%,var(--sheet))}
.opt.wrong{border-color:var(--badc);background:color-mix(in srgb,var(--badc) 10%,var(--sheet))}
.why{margin-top:10px;font-size:14.5px;color:var(--ink);padding:10px 12px;background:var(--acc-soft);border-radius:var(--r)}
.bar{height:5px;background:var(--rule);overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--kelly);width:0;transition:width .3s}
.score{font-family:var(--slab);font-size:56px;color:var(--forest)}
html.dark .score{color:var(--acc)}
/* flashcards */
.fcwrap{perspective:1200px;max-width:640px;margin:18px auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:30px;border-radius:var(--r);border:1px solid var(--rule2);border-top:34px solid var(--forest);background:var(--sheet)}
.face.back{transform:rotateY(180deg);border-top-color:var(--kelly)}
.face .tt{font-family:var(--slab);font-size:clamp(22px,3.2vw,30px);color:var(--forest)}
html.dark .face .tt{color:var(--ink)}
.face .dd{font-size:clamp(16px,2.3vw,19px)}
.face .hud{position:absolute;top:-27px;left:14px;right:14px;text-align:left;color:#fff;font-size:13px}
.fctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.pill{background:var(--sheet);border:1px solid var(--rule2);border-radius:var(--r);padding:6px 12px;font-family:var(--cond);font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--forest)}
html.dark .pill{color:var(--ink)}
.pill:hover{border-color:var(--kelly)}
.pill.on{background:var(--forest);border-color:var(--forest);color:#fff}
html.dark .pill.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.res{display:block;width:100%;text-align:left;margin-bottom:10px}
mark{background:var(--hi);color:var(--hi-ink);border-radius:2px;padding:0 1px}
/* tracker: accordion rows like the UAM program search */
.tkbar{height:8px;background:rgba(255,255,255,.25);overflow:hidden;display:flex}
.card:not(.tkc) .tkbar{background:var(--rule)}
.tkbar i{display:block;height:100%}.tkbar .g{background:var(--kelly)}.tkbar .a{background:var(--revc)}
.tkc{margin:10px 0;padding:12px 14px}
.tkrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 6px;border-top:1px solid var(--rule)}
.tkrow:first-child,.tkhead{border-top:0}
.tkhead{padding-top:0}
.tkname{background:none;border:0;padding:0;text-align:left;font-family:var(--cond);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.02em;color:var(--forest);cursor:pointer;display:flex;gap:8px;align-items:flex-start}

.tkname:hover{color:var(--kelly2)}
.tkb{display:flex;gap:6px;flex:none}
.tkm,.tkr{font-family:var(--cond);font-size:13px;text-transform:uppercase;letter-spacing:.03em;padding:4px 10px;border-radius:var(--r);border:1px solid var(--rule2);background:var(--sheet);color:var(--muted);cursor:pointer}
.tkm:hover{border-color:var(--okc);color:var(--okc)}.tkr:hover{border-color:var(--revc);color:var(--revc)}
.tkm.on{background:var(--okc);border-color:var(--okc);color:#fff}
.tkr.on{background:var(--revc);border-color:var(--revc);color:#fff}
html.dark .tkm.on,html.dark .tkr.on{color:var(--acc-ink)}
.tkrow.s1 .tkt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--okc)}
.tkrow.s2 .tkt{font-weight:700}
.tkt{background:none;border:0;padding:0;text-align:left;font-size:14.5px;flex:1;min-width:0;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.tkt:hover{color:var(--kelly2)}
.tkc2{flex:none;width:18px;height:18px;margin-top:2px;border-radius:2px;border:1px solid var(--forest);display:inline-grid;place-items:center;font-size:13px;line-height:1;color:var(--forest)}
html.dark .tkc2{border-color:var(--acc);color:var(--acc)}
.tkinfo{margin:0 6px 8px 32px;padding:10px 12px;background:var(--acc-soft);border-radius:var(--r);font-size:14.5px;line-height:1.6}
@media(max-width:600px){.tkrow{flex-wrap:wrap}}
/* answers */

.ansbody ul,.ansbody ol{margin:6px 0 6px 22px;padding:0}

.ansbody p{margin:6px 0}

<script>

function calcEval(src){

 function num(){sp();var m=/^(\d*\.?\d+(?:e[+-]?\d+)?)/i.exec(s.slice(i));if(m){i+=m[0].length;return parseFloat(m[0])}
  var f=/^(sqrt|log|ln|sin|cos|tan|pi|exp10|exp)/.exec(s.slice(i));if(f){i+=f[0].length;if(f[0]==="pi")return Math.PI;var v=fac();var d=Math.PI/180;return {sqrt:Math.sqrt(v),log:Math.log10(v),ln:Math.log(v),sin:Math.sin(v*d),cos:Math.cos(v*d),tan:Math.tan(v*d),exp10:Math.pow(10,v),exp:Math.exp(v)}[f[0]]}

 function add(){var v=mul();for(;;){sp();if(s[i]==="+"){i++;v+=mul()}else if(s[i]==="-"){i++;v-=mul()}else return v}}
 var r=add();sp();if(i<s.length)throw 0;return r}

/* ---------- full-screen slideshow ---------- */
var SHOW=null,shw=document.createElement("div");shw.id="shw";document.body.appendChild(shw);
function showStart(kind){
 var list,k;
 if(kind==="t"){var t=topicById(S.tid);list=t.slides;k=Math.min(S.sl||0,list.length-1)}
 else{var c=CH.filter(function(x){return x.id===S.sch})[0];list=chDeck(c);k=S.sk||0}
 SHOW={kind:kind,list:list,k:k};showDraw();shw.classList.add("on");
 var r=shw.requestFullscreen||shw.webkitRequestFullscreen;if(r)try{r.call(shw)}catch(e){}
}
function showDraw(){
 var L=SHOW.list,k=SHOW.k;
 shw.innerHTML='<div class="shwstage"><div class="shwslide">'+sldHTML(L[k],k,L.length)+'</div></div><div class="shwctl"><button data-sv="-1"'+(k===0?' disabled':'')+'>&larr;</button><span>'+(k+1)+' / '+L.length+'</span><button data-sv="1"'+(k===L.length-1?' disabled':'')+'>&rarr;</button><button data-sv="g">All slides</button><button data-sv="x">Exit</button></div>'+(SHOW.grid?showGrid():'');

}
function showGrid(){return '<div class="shwgrid"><div class="shwgh"><b>All slides</b><button data-sv="g">Close</button></div><div class="shwgl">'+SHOW.list.map(function(x,i){var t=x.ttl?'Title':x.ov?'Overview':x.div?('Section '+x.no+': '+x.title):x.title;return '<button class="shwt'+(i===SHOW.k?' on':'')+(x.div||x.ttl?' dv':'')+'" data-go="'+i+'"><span class="n">'+(i+1)+'</span>'+(x.img?'<img src="'+x.img+'" alt="" loading="lazy" decoding="async">':'')+'<span class="tt">'+t+'</span></button>'}).join("")+'</div></div>'}
function showFit(){var el=shw.querySelector(".shwslide");if(!el)return;var sc=Math.min(window.innerWidth/1280,window.innerHeight/720);el.style.transform="scale("+sc+")"}
function showMove(d){if(!SHOW)return;var n=Math.max(0,Math.min(SHOW.list.length-1,SHOW.k+d));if(n!==SHOW.k){SHOW.k=n;showDraw()}}
function showEnd(){if(!SHOW)return;var s0=SHOW;SHOW=null;shw.classList.remove("on");shw.innerHTML="";
 if(s0.kind==="t"){S.sl=s0.k;if(S.view==="topic")topic()}else{S.sk=s0.k;if(S.view==="slides")slidesView()}
 var ex=document.exitFullscreen||document.webkitExitFullscreen;if((document.fullscreenElement||document.webkitFullscreenElement)&&ex)try{ex.call(document)}catch(e){}}
window.addEventListener("resize",showFit);
document.addEventListener("fullscreenchange",function(){if(!document.fullscreenElement&&SHOW)showEnd()});
document.addEventListener("webkitfullscreenchange",function(){if(!document.webkitFullscreenElement&&SHOW)showEnd()});
shw.addEventListener("click",function(e){var b=e.target.closest("button");if(b&&b.dataset.go!==undefined){e.stopPropagation();SHOW.k=+b.dataset.go;SHOW.grid=false;showDraw();return}if(b&&b.dataset.sv){e.stopPropagation();if(b.dataset.sv==="x")showEnd();else if(b.dataset.sv==="g"){SHOW.grid=!SHOW.grid;showDraw()}else showMove(+b.dataset.sv);return}if(e.target.closest(".shwgrid"))return;
 if(e.target.closest(".shwctl"))return;showMove(e.clientX<window.innerWidth/3?-1:1)});
document.addEventListener("keydown",function(e){if(!SHOW)return;var k=e.key;
 if(SHOW.grid&&k!=="Escape"&&k!=="g"&&k!=="G")return;if(k==="ArrowRight"||k==="ArrowDown"||k==="PageDown"||k===" "||k==="Enter"){e.preventDefault();e.stopImmediatePropagation();showMove(1)}
 else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"||k==="Backspace"){e.preventDefault();e.stopImmediatePropagation();showMove(-1)}
 else if(k==="Home"){SHOW.k=0;showDraw()}else if(k==="End"){SHOW.k=SHOW.list.length-1;showDraw()}
 else if(k==="g"||k==="G"){SHOW.grid=!SHOW.grid;showDraw()}
 else if(k==="Escape"){e.stopImmediatePropagation();if(SHOW.grid){SHOW.grid=false;showDraw()}else showEnd()}},true);

 if(!c){h+='<p>No cards.</p>';main.innerHTML=h;return}
 h+='<div class="'+th(c.ch)+'"><div class="fcwrap"><div class="fc'+(f.flip?' flip':'')+'" id="fc" tabindex="0" aria-label="Flashcard, press to flip"><div class="face"><span class="hud">'+esc(c.top)+'</span><div class="tt">'+c.t+'</div></div><div class="face back"><span class="hud">Definition</span><div class="dd">'+c.d+'</div></div></div></div></div>'+
 '<div class="fctl"><button class="btn" id="fprev">&larr; Back</button><button class="btn pri" id="fflip">Flip</button><button class="btn" id="fnext">Next &rarr;</button><button class="btn" id="fshuf">Shuffle</button></div><div class="bar" style="max-width:640px;margin:16px auto"><i style="width:'+Math.round(100*(f.i+1)/f.cards.length)+'%"></i></div><div class="hud" style="text-align:center">Card '+(f.i+1)+' of '+f.cards.length+' &middot; arrow keys to move, space to flip</div>';
 main.innerHTML=h;
 $("#fc").onclick=function(){f.flip=!f.flip;this.classList.toggle("flip")};
 $("#fflip").onclick=function(){$("#fc").click()};
 $("#fnext").onclick=function(){f.i=(f.i+1)%f.cards.length;f.flip=false;flash()};
 $("#fprev").onclick=function(){f.i=(f.i-1+f.cards.length)%f.cards.length;f.flip=false;flash()};
 $("#fshuf").onclick=function(){f.cards=shuffle(f.cards);f.i=0;f.flip=false;flash()};
}
/* ---------- quiz ---------- */
function qpool(scope){var a=[];TOPICS.forEach(function(t){if(scope==="all"||t._ch.id===scope)(t.quiz||[]).forEach(function(q){a.push({q:q,top:t.title,ch:t._ch})})});return a}
function quiz(){
 var scopes=[["all","All chapters"]].concat(CH.map(function(x){return [x.id,"Ch "+x.num+" "+x.title]}));
 if(!S.q){
  var h='<div class="hud">Practice</div><h1 style="margin:4px 0 8px">Practice questions</h1><p style="color:var(--dim)">10 random questions from the topics you pick. You see the explanation after each answer.</p><div class="sel">'+scopes.map(function(s){return '<button class="pill'+(S.qzScope===s[0]?' on':'')+'" data-qzs="'+s[0]+'">'+esc(s[1])+' ('+qpool(s[0]).length+')</button>'}).join("")+'</div><div style="margin-top:14px"><button class="btn pri" id="qstart">Start quiz</button></div>'+(S.best[S.qzScope]!=null?'<p class="hud" style="margin-top:14px">Best score here: '+S.best[S.qzScope]+'%</p>':'');
  main.innerHTML=h;$("#qstart").onclick=function(){var p=shuffle(qpool(S.qzScope)).slice(0,10);S.q={scope:S.qzScope,list:p,i:0,score:0,miss:[],ans:false};quiz()};return;
 }
 var Q=S.q;
 if(Q.i>=Q.list.length){
  var pc=Math.round(100*Q.score/Q.list.length);if(S.best[Q.scope]==null||pc>S.best[Q.scope]){S.best[Q.scope]=pc}if(Q.scope!=="all"&&(S.best.all==null||pc>S.best.all)){} save();
  var h='<div class="hud">Result</div><div class="card glow" style="text-align:center;padding:30px"><div class="score">'+Q.score+'/'+Q.list.length+'</div><div style="font-size:18px;margin:6px 0 16px">'+(pc>=80?'Strong. Keep it up.':pc>=60?'Getting there. Review the missed topics below.':'Review the missed topics, then try again.')+'</div><div class="sel" style="justify-content:center"><button class="btn pri" id="qagain">New quiz</button></div></div>';
  if(Q.miss.length)h+='<h3 style="margin:20px 0 10px">Review these topics</h3>'+Q.miss.map(function(m){return '<button class="card res" data-t="'+m.id+'"><b>'+esc(m.top)+'</b><div style="color:var(--dim);font-size:13.5px;margin-top:4px">'+m.q.q+'</div></button>'}).join("");
  main.innerHTML=h;$("#qagain").onclick=function(){S.q=null;quiz()};return;
 }
 var cur=Q.list[Q.i];
 main.innerHTML='<div class="'+th(cur.ch)+'"><div class="hud">Question '+(Q.i+1)+' of '+Q.list.length+' &middot; '+esc(cur.top)+'</div><div class="bar"><i style="width:'+Math.round(100*Q.i/Q.list.length)+'%"></i></div>'+qHTML(cur.q,0)+'<div style="display:flex;gap:8px"><button class="btn pri hide" id="qnext">'+(Q.i===Q.list.length-1?'See result':'Next question')+'</button><button class="btn" id="qquit">Quit</button></div></div>';
 wireQ(main,function(ok){if(ok)Q.score++;else{var t=TOPICS.filter(function(x){return x.title===cur.top})[0];Q.miss.push({id:t.id,top:cur.top,q:cur.q})}$("#qnext").classList.remove("hide")},function(){return cur.q});
 $("#qnext").onclick=function(){Q.i++;quiz()};$("#qquit").onclick=function(){S.q=null;go("home")};
}

/* ---------- tracker ---------- */
function tkState(kind,id){return kind==="t"?(S.done[id]?1:(S.rev[id]?2:0)):(S.sub[id]||0)}
function tkMatch(st){return S.tf==="all"||(S.tf==="done"&&st===1)||(S.tf==="rev"&&st===2)||(S.tf==="new"&&st===0)}
function tkBtns(kind,id){var st=tkState(kind,id),a=kind==="t"?"data-tk":"data-sk";return '<span class="tkb"><button class="tkm'+(st===1?' on':'')+'" '+a+'="m|'+id+'" aria-pressed="'+(st===1)+'">Mastered</button><button class="tkr'+(st===2?' on':'')+'" '+a+'="r|'+id+'" aria-pressed="'+(st===2)+'">Needs review</button></span>'}
function track(){
 var n={1:0,2:0,0:0},tot=0;
 TOPICS.forEach(function(t){n[tkState("t",t.id)]++;tot++;(t.subs||[]).forEach(function(x,i){n[tkState("s",t.id+"#"+i)]++;tot++})});
 var pills=[["all","All"],["rev","Needs review ("+n[2]+")"],["new","Not yet reviewed ("+n[0]+")"],["done","Mastered ("+n[1]+")"]];
 var h='<div class="hud">Progress tracker</div><h1 style="margin:4px 0 6px">Progress</h1><p style="color:var(--dim);max-width:70ch;margin:0 0 14px">Mark each topic Mastered or Needs review. Use the filter to see what to go back to.</p>';
 h+='<div class="card glow"><div class="tkbar"><i class="g" style="width:'+(100*n[1]/tot)+'%"></i><i class="a" style="width:'+(100*n[2]/tot)+'%"></i></div><div class="stats trkst" style="margin-top:12px"><div class="stat"><b>'+n[1]+'</b><span>mastered</span></div><div class="stat"><b class="rev">'+n[2]+'</b><span>need review</span></div><div class="stat"><b class="new">'+n[0]+'</b><span>not yet reviewed</span></div><div class="stat"><b>'+Math.round(100*n[1]/tot)+'%</b><span>of '+tot+' items mastered</span></div></div></div>';
 h+='<div class="sel" style="margin:14px 0">'+pills.map(function(x){return '<button class="pill'+(S.tf===x[0]?' on':'')+'" data-tf="'+x[0]+'">'+x[1]+'</button>'}).join("")+'<button class="pill" data-tkall="1">Expand all</button><button class="pill" data-tkall="0">Collapse all</button><button class="pill" data-tkreset="1">Reset all</button></div>';
 CH.forEach(function(c){
  var body='',cd=0,ct=0;
  c.topics.forEach(function(t){
   var st=tkState("t",t.id),subs=t.subs||[],rows='',any=tkMatch(st);
   subs.forEach(function(x,i){var k=t.id+"#"+i,ss=tkState("s",k);ct++;if(ss===1)cd++;if(tkMatch(ss)){any=true;var op=!!S.tko[k],inf=(t.subsInfo||[])[i];rows+='<div class="tkrow s'+ss+'"><button class="tkt'+(op?' open':'')+'" data-tko="'+k+'" aria-expanded="'+op+'"><span class="tkc2">'+(op?'&minus;':'+')+'</span>'+esc(x)+'</button>'+tkBtns("s",k)+'</div>'+(op?'<div class="tkinfo">'+(inf||'Open the topic for details.')+'</div>':'')}});
   ct++;if(st===1)cd++;
   if(!any)return;
   var tk="T:"+t.id,to=!!S.tko[tk];body+='<div class="card tkc s'+st+'"><div class="tkrow tkhead"><button class="tkname" data-tko="'+tk+'" aria-expanded="'+to+'"><span class="tkc2">'+(to?'&minus;':'+')+'</span>'+esc(t.title)+'</button>'+tkBtns("t",t.id)+'</div>'+(to?'<div class="tkinfo"><b>Summary.</b> '+t.gist+'<div style="margin-top:8px"><button class="btn pri" data-t="'+t.id+'">Open this topic</button></div></div>':'')+rows+'</div>';
  });
  h+='<section class="'+th(c)+'" style="margin-top:22px"><div class="hud">Chapter '+c.num+' &middot; '+cd+' of '+ct+' mastered</div><h2 style="margin:2px 0 10px">'+esc(c.title)+'</h2>'+(body||'<p style="color:var(--dim)">Nothing here for this filter.</p>')+'</section>';
 });
 main.innerHTML=h;
}
/* ---------- search ---------- */
function search(){
 var q=S.query.toLowerCase();var hits=[];
 TOPICS.forEach(function(t){
  var parts=[["Topic",t.title],["Summary",strip(t.gist)]];
  t.points.forEach(function(p){parts.push([strip(p.h),strip(p.t)])});(t.terms||[]).forEach(function(x){parts.push(["Term: "+strip(x.t),strip(x.d)])});
  var m=parts.filter(function(p){return (p[0]+" "+p[1]).toLowerCase().indexOf(q)>-1}).slice(0,3);
  if(m.length)hits.push({t:t,m:m});
 });
 function hl(s){var i=s.toLowerCase().indexOf(q);if(i<0)return esc(s.slice(0,160));var a=Math.max(0,i-50);return esc(s.slice(a,a+170)).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"),function(x){return "<mark>"+x+"</mark>"})}
 main.innerHTML='<div class="hud">Search</div><h2 style="margin-bottom:14px">'+hits.length+' topic'+(hits.length===1?'':'s')+' match "'+esc(S.query)+'"</h2>'+hits.map(function(h){return '<button class="card res '+th(h.t._ch)+'" data-t="'+h.t.id+'"><b style="color:var(--acc)">'+esc(h.t.title)+'</b><div class="hud">Ch '+h.t._ch.num+'</div>'+h.m.map(function(m){return '<div style="color:var(--dim);font-size:13.5px;margin-top:6px"><b style="color:var(--ink)">'+esc(m[0])+'</b> '+hl(m[1])+'</div>'}).join("")+'</button>'}).join("");
}
/* ---------- events ---------- */
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.id==="burger"){$(".shell").classList.toggle("nolist");return}
 if(b.id==="logo"){S.q=null;go("home");return}
 var d=b.dataset;
 if(d.m==="tools")S.tool=null;
 if(d.m){if(d.m!=="quiz")S.q=S.q&&S.q.i>=S.q.list.length?null:S.q;go(d.m);return}
 if(d.fs){showStart(d.fs);return}
 if(b.id==="whoe"){go(isAdmin()?"home":"me");return}
 if(d.tool!==undefined){S.tool=d.tool||null;go("tools");return}
 if("sch" in d){S.sch=d.sch||null;S.sk=0;go("slides");return}
 if(d.sk){var c0=CH.filter(function(x){return x.id===S.sch})[0],n0=chDeck(c0).length;S.sk=d.sk.charAt(0)==="="?+d.sk.slice(1):Math.max(0,Math.min(n0-1,(S.sk||0)+(+d.sk)));slidesView();return}
 if(d.ch){S.ch=d.ch;var cc=CH.filter(function(x){return x.id===d.ch})[0];if(cc&&cc.topics.length){S.tid=cc.topics[0].id;S.tab="learn";go("topic")}else go("sector");return}
 if(d.t){S.tid=d.t;S.tab="learn";go("topic");return}
 if(d.tab){S.tab=d.tab;topic();return}
 if(d.nav){var t=topicById(S.tid),c=t._ch,i=c.topics.indexOf(t)+(+d.nav);if(c.topics[i]){S.tid=c.topics[i].id;S.tab="learn";go("topic")}return}
 if(d.tk||d.sk){var pr=(d.tk||d.sk).split("|"),act=pr[0],id=pr[1],isT=!!d.tk;
  if(isT){var was=tkState("t",id);S.done[id]=false;S.rev[id]=false;
   if(act==="m"&&was!==1){S.done[id]=true;var tt=topicById(id);(tt.subs||[]).forEach(function(x,i){S.sub[id+"#"+i]=1})}
   else if(act==="m"&&was===1){var t2=topicById(id);(t2.subs||[]).forEach(function(x,i){delete S.sub[id+"#"+i]})}
   if(act==="r"&&was!==2)S.rev[id]=true}
  else{var w=S.sub[id]||0,nv=act==="m"?1:2;if(w===nv)delete S.sub[id];else S.sub[id]=nv}
  save();modes();sidebar();track();return}
 if(d.tf){S.tf=d.tf;track();return}
 if(d.tko){S.tko[d.tko]=!S.tko[d.tko];track();return}
 if(d.tkall){S.tko={};if(d.tkall==="1")TOPICS.forEach(function(t){S.tko["T:"+t.id]=true;(t.subs||[]).forEach(function(x,i){S.tko[t.id+"#"+i]=true})});track();return}
 if(d.tkreset){if(confirm("Clear all mastered and review marks?")){S.done={};S.rev={};S.sub={};save();render()}return}
 if(d.done){S.rev[d.done]=false;S.done[d.done]=!S.done[d.done];save();render();return}
 if(d.fcs){S.fcScope=d.fcs;S.fc=null;flash();return}
 if(d.fcn){S.fcScope=d.fcn;S.fc=null;go("flash");return}
 if(d.qzs){S.qzScope=d.qzs;quiz();return}
 if(b.classList.contains("term")){b.classList.toggle("closed");return}
});
$("#q").addEventListener("input",function(e){var v=e.target.value.trim();if(v.length>1){S.query=v;S.view="search";render()}else if(S.view==="search"){go("home")}});
document.addEventListener("keydown",function(e){
 if(e.target.tagName==="INPUT")return;
 if(S.view==="flash"&&S.fc){if(e.key==="ArrowRight")$("#fnext").click();else if(e.key==="ArrowLeft")$("#fprev").click();else if(e.key===" "){e.preventDefault();$("#fflip").click()}}
 if(S.view==="slides"&&S.sch){if(e.key==="ArrowRight"){var nb=document.querySelector('[data-sk="1"]');if(nb&&!nb.disabled)nb.click()}else if(e.key==="ArrowLeft"){var pb=document.querySelector('[data-sk="-1"]');if(pb&&!pb.disabled)pb.click()}}
 if(e.key==="Escape"&&S.view!=="home")go("home");
});
document.getElementById("whoe").textContent=window.UAMUSER.n;document.getElementById("signout").onclick=function(){try{localStorage.removeItem(window.UAMSK)}catch(e){}window.UAMCLEAR&&window.UAMCLEAR();window.name="";location.reload()};
render();loadMine();
};if(window.UAMUSER)window.UAMSTART();
</script>
